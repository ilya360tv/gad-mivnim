<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מערכת ניהול קבלנים | GAD MIVNIM</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b0d10">
  <link rel="icon" href="/favicon.ico" sizes="any">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css?v=19">
  <link rel="stylesheet" href="css/field-select.css?v=2">
</head>
<body>

  <!-- ===== אין הרשאה (הכניסה עצמה בדף manage.html) ===== -->
  <main class="adm-login" id="admDenied" hidden>
    <div class="adm-card adm-login-card">
      <h1 class="adm-login-title" id="admDeniedTitle" tabindex="-1">אין לך הרשאה</h1>
      <p class="adm-note">לחשבון הזה אין הרשאה למערכת הניהול.</p>
      <a href="manage.html" class="adm-btn adm-btn-primary adm-btn-block">החלפת אזור ⇄</a>
      <button type="button" class="adm-btn adm-btn-ghost adm-btn-block" id="admDeniedOut">יציאה</button>
    </div>
  </main>

  <!-- ===== מערכת הניהול ===== -->
  <div class="adm-app" id="admApp" hidden>
    <aside class="adm-side">
      <div class="adm-brand">
        <img src="images/gad_mivnim_logo.svg" alt="" width="44" height="44">
        <div>
          <strong>GAD MIVNIM</strong>
          <span>מערכת ניהול קבלנים</span>
        </div>
      </div>
      <nav class="adm-nav" aria-label="תפריט ניהול">
        <button type="button" data-view="dashboard" class="is-active" aria-current="page">לוח בקרה</button>
        <button type="button" data-view="tenders">מכרזים</button>
        <button type="button" data-view="applicants">בקשות הצטרפות <span class="adm-badge" id="admPendingBadge" hidden></span></button>
        <button type="button" data-view="contractors">קבלנים מאושרים</button>
        <button type="button" data-view="applications">מועמדויות</button>
        <button type="button" data-view="ads" hidden>פרסומות <span class="adm-badge" id="admAdsBadge" hidden></span></button>
        <button type="button" data-view="editors">משתמשים</button>
        <button type="button" data-view="settings">הגדרות</button>
      </nav>
    </aside>

    <div class="adm-main">
      <header class="adm-top">
        <h1 class="adm-view-title" id="admViewTitle" tabindex="-1">לוח בקרה</h1>
        <div class="adm-top-actions">
          <a href="manage.html" class="adm-btn adm-btn-ghost adm-btn-sm">החלפת אזור ⇄</a>
          <a href="content.html" class="adm-link">מערכת ניהול אתר הבית ←</a>
          <a href="tenders.html" class="adm-link" target="_blank" rel="noopener">לאתר ←</a>
          <button type="button" class="adm-btn adm-btn-ghost" id="admLogout">יציאה</button>
        </div>
      </header>
      <div class="adm-content" id="admContent"></div>
    </div>
  </div>

  <!-- חלון כללי (טפסים / אישורים) -->
  <div class="adm-modal" id="admModal" hidden>
    <div class="adm-modal-backdrop" data-close></div>
    <div class="adm-modal-box adm-card" role="dialog" aria-modal="true" aria-labelledby="admModalTitle">
      <button type="button" class="adm-modal-x" data-close aria-label="סגירה">×</button>
      <h2 class="adm-modal-title" id="admModalTitle"></h2>
      <div id="admModalBody"></div>
    </div>
  </div>

  <p class="adm-toast" id="admToast" role="status" aria-live="polite"></p>

  <script src="js/supabase-config.js?v=1"></script>
  <script src="js/data-store.js?v=20"></script>
  <script src="js/field-select.js?v=2"></script>
  <script src="js/form-errors.js?v=2"></script>
  <script src="js/password-eye.js?v=1"></script>
  <script src="js/contractor-docs.js?v=2"></script>
  <script src="js/admin.js?v=21"></script>
</body>
</html>
