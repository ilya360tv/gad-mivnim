<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>סטודיו תוכן | GAD MIVNIM</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b0d10">
  <link rel="icon" href="/favicon.ico" sizes="any">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/admin.css?v=17">
  <link rel="stylesheet" href="css/content.css?v=3">
</head>
<body class="ct">

  <!-- ===== אין הרשאה ===== -->
  <main class="adm-login" id="ctDenied" hidden>
    <div class="adm-card adm-login-card">
      <h1 class="adm-login-title" id="ctDeniedTitle" tabindex="-1">אין לך הרשאה</h1>
      <p class="adm-note">לחשבון הזה אין הרשאה לסטודיו, או שהוא הושבת. לפרטים פנו למנהל האתר.</p>
      <a href="manage.html" class="adm-btn adm-btn-primary adm-btn-block">החלפת אזור ⇄</a>
      <button type="button" class="adm-btn adm-btn-ghost adm-btn-block" id="ctDeniedOut">יציאה</button>
    </div>
  </main>

  <!-- ===== הסטודיו ===== -->
  <div class="ct-app" id="ctApp" hidden>
    <header class="ct-top">
      <div class="ct-brand">
        <img src="images/gad_mivnim_logo.svg" alt="" width="44" height="44">
        <div><strong>סטודיו תוכן</strong><span>GAD MIVNIM</span></div>
      </div>
      <div class="ct-user">
        <a href="manage.html" class="adm-btn adm-btn-ghost adm-btn-sm" id="ctSwitch" hidden>החלפת אזור ⇄</a>
        <a href="admin.html" class="adm-link" id="ctToAdmin" hidden>מעבר לניהול המלא ←</a>
        <span class="adm-muted" id="ctWho"></span>
        <button type="button" class="adm-btn adm-btn-ghost" id="ctLogout">יציאה</button>
      </div>
    </header>

    <div class="ct-layout" id="ctLayout">
    <aside class="ct-sidebar" id="ctSidebar">
      <button type="button" class="adm-btn adm-btn-ghost ct-menubtn" id="ctMenuBtn" aria-expanded="false" aria-controls="ctSide">☰ תפריט הסטודיו</button>
      <nav class="ct-side" id="ctSide" aria-label="תפריט הסטודיו"></nav>
    </aside>
    <div class="ct-content">
    <nav class="ct-tabs" id="ctTabs" role="tablist" aria-label="פרסומות" hidden>
      <button type="button" role="tab" id="tab-list" aria-controls="ctPanel" aria-selected="true" data-tab="list">הפרסומות</button>
      <button type="button" role="tab" id="tab-new" aria-controls="ctPanel" aria-selected="false" tabindex="-1" data-tab="new">פרסומת חדשה</button>
      <button type="button" role="tab" id="tab-media" aria-controls="ctPanel" aria-selected="false" tabindex="-1" data-tab="media">ספריית מדיה</button>
    </nav>

    <main class="ct-main" id="ctPanel" tabindex="-1"></main>
    </div>
    </div>
  </div>

  <!-- חלון אישור -->
  <div class="adm-modal" id="ctModal" hidden>
    <div class="adm-modal-backdrop" data-close></div>
    <div class="adm-modal-box adm-card" role="dialog" aria-modal="true" aria-labelledby="ctModalTitle">
      <button type="button" class="adm-modal-x" data-close aria-label="סגירה">×</button>
      <h2 class="adm-modal-title" id="ctModalTitle"></h2>
      <div id="ctModalBody"></div>
    </div>
  </div>

  <p class="adm-toast" id="ctToast" role="status" aria-live="polite"></p>

  <script src="js/supabase-config.js?v=1"></script>
  <script src="js/data-store.js?v=19"></script>
  <script src="js/form-errors.js?v=2"></script>
  <script src="js/studio.js?v=2"></script>
  <script src="js/content.js?v=6"></script>
</body>
</html>
