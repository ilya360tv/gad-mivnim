<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אין חיבור | GAD MIVNIM</title>
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0b0d10">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; text-align: center;
      font-family: "Rubik", "Heebo", "Assistant", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background: #0b0d10; color: #ffffff;
    }
    .box { max-width: 420px; }
    img { width: 140px; height: 140px; margin-bottom: 28px; }
    h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 12px; }
    p { color: #b8bec6; line-height: 1.6; margin-bottom: 28px; }
    button {
      font: inherit; font-weight: 500; font-size: 1.05rem; cursor: pointer;
      background: #16a34a; color: #fff; border: 0; border-radius: 999px;
      padding: 14px 40px; min-height: 48px;
    }
    button:hover { background: #0f7a37; }
    button:focus-visible { outline: 3px solid #2dd4bf; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="box">
    <img src="/images/gad_mivnim_logo.svg" alt="GAD MIVNIM">
    <h1>אין חיבור לאינטרנט כרגע</h1>
    <p>בדקו את החיבור ונסו שוב — אנחנו כאן, בכל מקום במפה.</p>
    <button type="button" onclick="location.reload()">נסו שוב</button>
  </main>
</body>
</html>
